name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .github/workflows/ci-cd.yml
  workflow_dispatch:

env:
  APP_NAME: heartbeat-api
  IAC_REPO: fernanduandrade/heartbeat-iac
  IAC_BRANCH: main
  IAC_APP_PATH: apps/heartbeat-api

jobs:
  build-and-deploy:
    name: Build, Push And Update IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Build application
        run: cargo build --locked

      - name: Test endpoints
        run: cargo test --locked

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_REPOSITORY="${{ secrets.DOCKERHUB_USERNAME }}/${APP_NAME}"
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Checkout IaC repository
        env:
          IAC_REPO_TOKEN: ${{ secrets.IAC_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${IAC_REPO_TOKEN}@github.com/${IAC_REPO}.git" iac
          cd iac
          git checkout "$IAC_BRANCH"

      - name: Update IaC image tag
        working-directory: iac
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          test -f "$IAC_APP_PATH/kustomization.yaml"
          cd "$IAC_APP_PATH"
          kustomize edit set image "${APP_NAME}=${IMAGE}"
          kustomize edit add configmap app-version-cm --from-literal="IMAGE_TAG=${IMAGE_TAG}" --behavior=replace

      - name: Commit and push IaC changes
        working-directory: iac
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$IAC_APP_PATH"

          if git diff --cached --quiet; then
            echo "No IaC changes to commit."
            exit 0
          fi

          git commit -m "chore: deploy ${APP_NAME} ${GITHUB_SHA::7}"
          git push origin "$IAC_BRANCH"
